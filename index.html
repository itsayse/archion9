<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Zen+Antique&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #07070d;
    --storm-blue: #131c33;
    --violet: #b455ff;
    --violet-dim: #6a2fb8;
    --cyan: #4ff0ff;
    --flash: #f2f6ff;
    --slate: #8892a8;
    --green: #43d17a;
    --yellow: #f2c94c;
    --red: #f04747;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background:var(--void);
    overflow:hidden;
    font-family:'Rajdhani', sans-serif;
  }

  /* ---------- STAGE ---------- */
  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    perspective:1000px;
  }

  /* ---------- VIDEO BACKGROUND ---------- */
  .bg-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    filter:saturate(0.75) contrast(1.15) brightness(0.55) blur(55px);
    transform:scale(1.15);
    z-index:0;
    transition:filter 1100ms ease, transform 1100ms ease;
  }

  body.started .bg-video{
    filter:saturate(0.75) contrast(1.15) brightness(0.55) blur(0px);
    transform:scale(1);
  }

  .bg-fallback{
    position:absolute;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(180,85,255,0.18), transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(79,240,255,0.10), transparent 50%),
      linear-gradient(180deg, #0a0d1c 0%, #05060c 60%, #030308 100%);
  }

  .bg-scan{
    position:absolute; inset:0; z-index:1;
    background:repeating-linear-gradient(
      0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px,
      transparent 1px, transparent 3px
    );
    mix-blend-mode:overlay;
    pointer-events:none;
  }

  .bg-vignette{
    position:absolute; inset:0; z-index:2;
    background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.75) 100%);
    pointer-events:none;
  }

  /* ---------- TITLE ---------- */
  .title-wrap{
    position:absolute; inset:0; z-index:5;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:1.4rem;
    text-align:center;
    filter:blur(18px);
    transition:filter 1100ms ease;
    padding:1rem;
    overflow-y:auto;
  }

  body.started .title-wrap{
    filter:blur(0px);
  }

  .pfp{
    width:clamp(72px, 12vw, 108px);
    height:clamp(72px, 12vw, 108px);
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(79,240,255,0.55);
    box-shadow:
      0 0 18px rgba(79,240,255,0.55),
      0 0 46px rgba(180,85,255,0.35),
      0 6px 20px rgba(0,0,0,0.5);
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none;
    animation:pfpPulse 4.5s ease-in-out infinite;
  }

  @keyframes pfpPulse{
    0%,100%{
      box-shadow:
        0 0 18px rgba(79,240,255,0.55),
        0 0 46px rgba(180,85,255,0.35),
        0 6px 20px rgba(0,0,0,0.5);
    }
    50%{
      box-shadow:
        0 0 26px rgba(79,240,255,0.8),
        0 0 66px rgba(180,85,255,0.5),
        0 6px 20px rgba(0,0,0,0.5);
    }
  }

  .pfp-wrap{
    position:relative;
    display:inline-block;
  }

  .pfp-status-dot{
    position:absolute;
    right:2%;
    bottom:2%;
    width:22%;
    height:22%;
    border-radius:50%;
    border:3px solid var(--void);
    background:var(--slate);
    transition:background 250ms ease;
  }
  .pfp-status-dot.online{ background:var(--green); }
  .pfp-status-dot.idle{ background:var(--yellow); }
  .pfp-status-dot.dnd{ background:var(--red); }
  .pfp-status-dot.offline{ background:var(--slate); }
  .social-links{
    display:flex;
    align-items:center;
    gap:1.4rem;
    pointer-events:auto;
  }

  .social-link{
    display:inline-flex;
    align-items:center;
    gap:0.5rem;
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    font-size:clamp(0.8rem, 1.6vw, 0.95rem);
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--slate);
    text-decoration:none;
    padding:0.5rem 1rem;
    border:1px solid rgba(138,150,180,0.35);
    border-radius:999px;
    background:rgba(19,28,51,0.35);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:color 180ms cubic-bezier(.34,1.56,.64,1), border-color 180ms cubic-bezier(.34,1.56,.64,1),
               box-shadow 180ms cubic-bezier(.34,1.56,.64,1), background 180ms ease,
               transform 150ms cubic-bezier(.34,1.56,.64,1);
  }

  .social-link svg{
    width:1.1em;
    height:1.1em;
    flex-shrink:0;
  }

  /* OChat logo (drop your file in as ochat-logo.png) */
  .social-link .ochat-logo{
    width:1.35em;
    height:1.35em;
    flex-shrink:0;
    object-fit:contain;
    border-radius:4px;
    -webkit-user-drag:none;
  }

  .social-link:hover,
  .social-link:focus-visible{
    color:var(--flash);
    background:rgba(19,28,51,0.65);
    transform:translateY(-2px) scale(1.04);
  }

  .social-link:active{
    transform:translateY(0) scale(0.96);
    transition-duration:80ms;
  }

  .social-link:focus-visible{
    outline:2px solid var(--cyan);
    outline-offset:3px;
  }

  .social-link.github:hover,
  .social-link.github:focus-visible{
    border-color:rgba(180,85,255,0.7);
    box-shadow:0 0 16px rgba(180,85,255,0.45);
  }

  .social-link.ochat:hover,
  .social-link.ochat:focus-visible{
    border-color:rgba(79,240,255,0.7);
    box-shadow:0 0 16px rgba(79,240,255,0.45);
  }

  .eyebrow{
    font-family:'Rajdhani', sans-serif;
    letter-spacing:0.55em;
    font-size:clamp(0.65rem, 1.6vw, 0.9rem);
    font-weight:600;
    color:var(--cyan);
    text-transform:uppercase;
    opacity:0.85;
    text-shadow:0 0 12px rgba(79,240,255,0.6);
  }

  .title-3d{
    position:relative;
    font-family:'Rubik Mono One', sans-serif;
    font-size:clamp(3.2rem, 12vw, 9rem);
    line-height:0.95;
    text-transform:uppercase;
    letter-spacing:0.02em;
    color:#fdfdff;
    -webkit-user-select:none; user-select:none;
    transform-style:preserve-3d;
    animation:floatTitle 6s ease-in-out infinite;
    text-shadow:
      0 1px 0 #d8c6ff,
      0 2px 0 #c9adf9,
      0 3px 0 #ba94f3,
      0 4px 0 #ab7bed,
      0 5px 0 #9c62e7,
      0 6px 0 #8d49e1,
      0 7px 0 #7e30db,
      0 8px 10px rgba(0,0,0,0.6),
      0 0 25px rgba(180,85,255,0.55),
      0 0 60px rgba(180,85,255,0.35),
      0 0 110px rgba(79,240,255,0.18);
  }

  .title-3d .glitch-layer{
    position:absolute; inset:0;
    opacity:0;
  }

  /* ---------- INTERACTIVE LETTERS ---------- */
  .letters{
    display:inline-block;
  }

  .letter{
    display:inline-block;
    cursor:default;
    -webkit-user-select:none; user-select:none;
    will-change:transform, color, text-shadow;
    transition:
      transform 320ms cubic-bezier(.2,.9,.3,1.4),
      color 200ms ease,
      text-shadow 200ms ease;
  }

  .letter.near{
    color:var(--cyan);
    text-shadow:
      0 0 8px rgba(79,240,255,0.9),
      0 0 22px rgba(79,240,255,0.6),
      0 0 46px rgba(180,85,255,0.4);
  }

  .letter.hover{
    color:var(--flash);
    text-shadow:
      0 0 10px rgba(255,255,255,0.95),
      0 0 26px rgba(79,240,255,0.9),
      0 0 56px rgba(180,85,255,0.7);
  }

  .letter.zap{
    animation:letterZap 420ms ease-out;
  }
  @keyframes letterZap{
    0%{ transform:translateY(0) scale(1) rotate(0deg); }
    25%{ transform:translateY(-16px) scale(1.28) rotate(-6deg); color:var(--cyan); }
    55%{ transform:translateY(4px) scale(0.92) rotate(4deg); color:var(--violet); }
    100%{ transform:translateY(0) scale(1) rotate(0deg); }
  }

  @media (hover:none){
    .letter.near{
      color:var(--cyan);
      text-shadow:0 0 10px rgba(79,240,255,0.7);
    }
  }

  /* ---------- ELECTRIC LETTER ---------- */
  .letter.electric{
    animation:electricFlicker 2.6s linear infinite;
  }

  @keyframes electricFlicker{
    0%,100%{
      color:#fdfdff;
      text-shadow:
        0 1px 0 #d8c6ff, 0 2px 0 #c9adf9, 0 3px 0 #ba94f3,
        0 4px 0 #ab7bed, 0 5px 0 #9c62e7, 0 6px 0 #8d49e1, 0 7px 0 #7e30db,
        0 8px 10px rgba(0,0,0,0.6),
        0 0 25px rgba(180,85,255,0.55), 0 0 60px rgba(180,85,255,0.35);
    }
    2%{ color:var(--cyan); text-shadow:0 0 6px var(--cyan), 0 0 16px var(--cyan), 0 0 40px var(--violet); }
    3%{ color:#fdfdff; text-shadow:0 0 2px rgba(255,255,255,0.3); }
    4%{ color:var(--cyan); text-shadow:0 0 10px var(--cyan), 0 0 30px var(--cyan), 0 0 60px var(--violet); }
    6%{
      color:#fdfdff;
      text-shadow:
        0 1px 0 #d8c6ff, 0 2px 0 #c9adf9, 0 3px 0 #ba94f3,
        0 4px 0 #ab7bed, 0 5px 0 #9c62e7, 0 6px 0 #8d49e1, 0 7px 0 #7e30db,
        0 8px 10px rgba(0,0,0,0.6),
        0 0 25px rgba(180,85,255,0.55), 0 0 60px rgba(180,85,255,0.35);
    }
    38%{ color:var(--cyan); text-shadow:0 0 8px var(--cyan), 0 0 24px var(--violet), 0 0 50px var(--violet); }
    39%{ color:#fdfdff; text-shadow:0 0 3px rgba(255,255,255,0.4); }
    40%{
      color:#fdfdff;
      text-shadow:
        0 1px 0 #d8c6ff, 0 2px 0 #c9adf9, 0 3px 0 #ba94f3,
        0 4px 0 #ab7bed, 0 5px 0 #9c62e7, 0 6px 0 #8d49e1, 0 7px 0 #7e30db,
        0 8px 10px rgba(0,0,0,0.6),
        0 0 25px rgba(180,85,255,0.55), 0 0 60px rgba(180,85,255,0.35);
    }
    70%{ color:var(--cyan); text-shadow:0 0 10px var(--cyan), 0 0 28px var(--cyan), 0 0 55px var(--violet); }
    72%{
      color:#fdfdff;
      text-shadow:
        0 1px 0 #d8c6ff, 0 2px 0 #c9adf9, 0 3px 0 #ba94f3,
        0 4px 0 #ab7bed, 0 5px 0 #9c62e7, 0 6px 0 #8d49e1, 0 7px 0 #7e30db,
        0 8px 10px rgba(0,0,0,0.6),
        0 0 25px rgba(180,85,255,0.55), 0 0 60px rgba(180,85,255,0.35);
    }
  }

  .letter.electric.near,
  .letter.electric.hover{
    animation-play-state:paused;
  }

  /* ---------- SPARK LAYER ---------- */
  .spark-layer{
    position:absolute; inset:0;
    z-index:6;
    pointer-events:none;
    overflow:visible;
  }

  .spark{
    position:absolute;
    top:0; left:0;
    filter:drop-shadow(0 0 4px var(--cyan)) drop-shadow(0 0 10px var(--violet));
    opacity:0;
    transform-origin:0% 0%;
    animation:sparkPulse 260ms ease-out forwards;
  }

  @keyframes sparkPulse{
    0%{ opacity:0; transform:scale(0.4) rotate(var(--rot,0deg)); }
    15%{ opacity:1; transform:scale(1.05) rotate(var(--rot,0deg)); }
    35%{ opacity:0.5; }
    55%{ opacity:0.9; }
    100%{ opacity:0; transform:scale(1.2) rotate(var(--rot,0deg)); }
  }

  @media (prefers-reduced-motion: reduce){
    .letter.electric{ animation:none !important; }
    .spark{ animation:none !important; display:none; }
  }

  @keyframes floatTitle{
    0%,100%{ transform:translateY(0) rotateX(6deg); }
    50%{ transform:translateY(-10px) rotateX(3deg); }
  }

  /* ---------- PRESENCE (Spotify via Lanyard) ---------- */
  .presence-card{
    display:flex;
    align-items:center;
    gap:0.8rem;
    padding:0.65rem 1rem;
    min-width:15rem;
    max-width:20rem;
    text-align:left;
    border:1px solid rgba(138,150,180,0.3);
    border-radius:14px;
    background:rgba(19,28,51,0.5);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:border-color 220ms ease, box-shadow 220ms ease;
  }

  .spotify-card{
    display:none;
  }
  .spotify-card.active{ display:flex; }

  .spotify-card:hover{
    border-color:rgba(67,209,122,0.55);
    box-shadow:0 0 16px rgba(67,209,122,0.25);
  }

  .spotify-art{
    width:46px;
    height:46px;
    border-radius:8px;
    object-fit:cover;
    flex-shrink:0;
    background:var(--storm-blue);
  }

  .spotify-info{
    display:flex;
    flex-direction:column;
    gap:0.2rem;
    min-width:0;
    flex:1;
  }

  .spotify-eyebrow{
    display:flex;
    align-items:center;
    gap:0.35rem;
    font-size:0.68rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--green);
  }

  .spotify-eyebrow svg{ width:0.85em; height:0.85em; }

  .spotify-track{
    font-weight:600;
    font-size:0.85rem;
    color:var(--flash);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .spotify-artist{
    font-size:0.76rem;
    color:var(--slate);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .spotify-bar{
    margin-top:0.15rem;
    height:3px;
    border-radius:2px;
    background:rgba(255,255,255,0.12);
    overflow:hidden;
  }

  .spotify-bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--cyan), var(--green));
    border-radius:2px;
  }

  /* ---------- PRESENCE ROW ---------- */
  .presence-row{
    display:flex;
    align-items:stretch;
    justify-content:center;
    flex-wrap:wrap;
    gap:0.9rem;
    width:100%;
    max-width:36rem;
    pointer-events:auto;
  }

  /* ---------- MUSIC PANEL ---------- */
  .music-panel{
    display:none;
    flex-direction:column;
    flex:1 1 20rem;
    width:100%;
    max-width:24rem;
    border-radius:16px;
    overflow:hidden;
    border:1px solid rgba(138,150,180,0.3);
    background:rgba(19,28,51,0.5);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    box-shadow:0 8px 30px rgba(0,0,0,0.45);
    pointer-events:auto;
    cursor:default;
    transition:border-color 180ms cubic-bezier(.34,1.56,.64,1), box-shadow 180ms cubic-bezier(.34,1.56,.64,1),
               transform 150ms cubic-bezier(.34,1.56,.64,1);
  }
  .music-panel.active{ display:flex; }
  .music-panel:hover{
    border-color:rgba(67,209,122,0.5);
    box-shadow:0 8px 30px rgba(0,0,0,0.45), 0 0 16px rgba(67,209,122,0.2);
    transform:translateY(-2px);
  }
  .music-panel:active{
    transform:translateY(0) scale(0.99);
    transition-duration:80ms;
  }

  .music-panel .spotify-card{
    display:flex;
    width:100%;
    max-width:none;
    border:0;
    border-radius:0;
    border-bottom:1px solid rgba(138,150,180,0.22);
    background:transparent;
    backdrop-filter:none;
  }
  .music-panel .spotify-card:hover{
    box-shadow:none;
  }
  .music-panel .spotify-card.idle .spotify-eyebrow{ color:var(--slate); }
  .music-panel .spotify-card.idle .spotify-bar{ display:none; }

  .playlist-wrap{
    display:none;
    align-items:center;
    gap:0.8rem;
    padding:0.7rem 1rem;
  }
  .playlist-wrap.aura{
    display:flex;
    animation:auraPulse 2.2s ease-in-out infinite;
  }
  @keyframes auraPulse{
    0%,100%{ box-shadow:inset 0 0 0 2px rgba(79,240,255,0.55), 0 0 16px rgba(79,240,255,0.4), 0 0 34px rgba(180,85,255,0.25); }
    50%{ box-shadow:inset 0 0 0 2px rgba(79,240,255,0.85), 0 0 24px rgba(79,240,255,0.7), 0 0 54px rgba(180,85,255,0.45); }
  }
  .playlist-cover{
    width:46px;
    height:46px;
    border-radius:8px;
    object-fit:cover;
    flex-shrink:0;
    background:var(--storm-blue);
  }
  .playlist-side-info{
    display:flex;
    flex-direction:column;
    gap:0.15rem;
    min-width:0;
  }
  .playlist-name{
    font-size:0.68rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--cyan);
  }
  .playlist-track{
    font-weight:600;
    font-size:0.85rem;
    color:var(--flash);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ----- Game card ----- */
  .game-card{
    display:none;
    flex:1 1 12rem;
    max-width:14rem;
    align-self:flex-start;
    cursor:default;
    transition:border-color 180ms cubic-bezier(.34,1.56,.64,1), box-shadow 180ms cubic-bezier(.34,1.56,.64,1),
               transform 150ms cubic-bezier(.34,1.56,.64,1);
  }
  .game-card.active{ display:flex; }
  .game-card:hover{
    border-color:rgba(180,85,255,0.55);
    box-shadow:0 8px 30px rgba(0,0,0,0.45), 0 0 16px rgba(180,85,255,0.3);
    transform:translateY(-2px);
  }
  .game-card:active{
    transform:translateY(0) scale(0.99);
    transition-duration:80ms;
  }
  .game-icon{
    width:46px;
    height:46px;
    border-radius:10px;
    object-fit:cover;
    flex-shrink:0;
    background:var(--storm-blue);
  }
  .game-info{
    display:flex;
    flex-direction:column;
    gap:0.2rem;
    min-width:0;
    flex:1;
  }
  .game-eyebrow{
    font-size:0.68rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--violet);
  }
  .game-name{
    font-weight:600;
    font-size:0.85rem;
    color:var(--flash);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .game-detail{
    font-size:0.76rem;
    color:var(--slate);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ---------- CLICK-TO-BEGIN OVERLAY ---------- */
  .enter-overlay{
    position:absolute; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    cursor:pointer;
    transition:opacity 700ms ease;
  }
  .enter-overlay.hidden{
    opacity:0;
    pointer-events:none;
  }
  .enter-text{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-weight:600;
    font-size:clamp(1rem, 2vw, 1.35rem);
    letter-spacing:0.01em;
    color:#f4f4f2;
    text-shadow:0 2px 14px rgba(0,0,0,0.55);
    animation:enterBreathe 2.6s ease-in-out infinite;
    transition:transform 150ms cubic-bezier(.34,1.56,.64,1), text-shadow 180ms ease;
  }
  .enter-overlay:hover .enter-text{
    transform:scale(1.05);
    text-shadow:0 2px 20px rgba(79,240,255,0.5);
  }
  .enter-overlay:active .enter-text{
    transform:scale(0.97);
    transition-duration:80ms;
  }
  @keyframes enterBreathe{
    0%,100%{ opacity:0.7; }
    50%{ opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .enter-text{ animation:none; opacity:0.9; }
  }

  /* ---------- BOTTOM MARK ---------- */
  .mark{
    position:absolute;
    bottom:2.2rem; left:50%; transform:translateX(-50%);
    z-index:5;
    font-size:0.68rem;
    letter-spacing:0.4em;
    color:var(--slate);
    text-transform:uppercase;
    opacity:0.6;
  }

  @media (prefers-reduced-motion: reduce){
    .title-3d{
      animation:none !important;
    }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <video class="bg-video" id="bgVideo" playsinline loop preload="auto">
    <source src="video.mp4" type="video/mp4">
  </video>
  <div class="bg-fallback" id="bgFallback"></div>

  <div class="bg-scan"></div>
  <div class="bg-vignette"></div>

<script>
  // ---------- Hide fallback once video actually has data ----------
  const video = document.getElementById('bgVideo');
  const fallback = document.getElementById('bgFallback');
  video.addEventListener('loadeddata', () => { fallback.style.display = 'none'; });
  video.addEventListener('error', () => { fallback.style.display = 'block'; });
  if (video.readyState >= 2){ fallback.style.display = 'none'; }

  video.addEventListener('loadedmetadata', () => {
    if (video.currentTime === 0){
      try { video.currentTime = 0.01; } catch(e){}
    }
  }, { once:true });

  // ---------- CLICK TO BEGIN ----------
  const enterOverlay = document.getElementById('enterOverlay');

  function beginExperience(){
    if (document.body.classList.contains('started')) return;
    document.body.classList.add('started');
    enterOverlay.classList.add('hidden');

    video.volume = 0.55;
    video.currentTime = 0;
    const playPromise = video.play();
    if (playPromise && playPromise.catch){
      playPromise.catch((err) => {
        console.warn('video.mp4 playback (with audio) was refused by the browser.', err);
      });
    }
  }

  enterOverlay.addEventListener('click', beginExperience);
  enterOverlay.addEventListener('touchend', beginExperience, { passive:true });

  // ---------- LETTER-BY-LETTER INTERACTIVITY ----------
  const letterEls = Array.from(document.querySelectorAll('.letter'));
  const NEAR_RADIUS = 160;
  const LIFT_MAX = 22;
  const TILT_MAX = 14;

  function updateLettersFromPoint(px, py){
    for (const el of letterEls){
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dx = px - cx;
      const dy = py - cy;
      const dist = Math.hypot(dx, dy);

      if (dist < NEAR_RADIUS){
        const t = 1 - dist / NEAR_RADIUS;
        const lift = LIFT_MAX * t;
        const tilt = (dx / NEAR_RADIUS) * TILT_MAX * t;
        const scale = 1 + 0.22 * t;
        el.style.transform = `translateY(${-lift}px) rotate(${tilt}deg) scale(${scale})`;
        el.classList.add('near');
        el.classList.toggle('hover', dist < 34);
      } else {
        el.style.transform = '';
        el.classList.remove('near', 'hover');
      }
    }
  }

  function resetLetters(){
    for (const el of letterEls){
      el.style.transform = '';
      el.classList.remove('near', 'hover');
    }
  }

  window.addEventListener('mousemove', (e) => {
    updateLettersFromPoint(e.clientX, e.clientY);
  });
  window.addEventListener('mouseleave', resetLetters);

  window.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches[0]){
      updateLettersFromPoint(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive:true });
  window.addEventListener('touchend', resetLetters);

  function zapLetter(el){
    el.classList.remove('zap');
    void el.offsetWidth;
    el.classList.add('zap');
  }

  letterEls.forEach((el) => {
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => zapLetter(el));
    el.addEventListener('touchstart', () => zapLetter(el), { passive:true });
  });

  // ---------- ELECTRIC SPARKS off the charged letter ----------
  const electricLetter = document.getElementById('electricLetter');
  const sparkLayer = document.getElementById('sparkLayer');

  function boltSVG(len, jag){
    let d = `M0 0`;
    const segments = 4 + Math.floor(Math.random() * 2);
    let x = 0, y = 0;
    const stepLen = len / segments;
    for (let i = 0; i < segments; i++){
      x += stepLen;
      y += (Math.random() - 0.5) * jag;
      d += ` L${x.toFixed(1)} ${y.toFixed(1)}`;
    }
    const w = len + 10, h = jag * 2 + 10;
    return `<svg width="${w}" height="${h}" viewBox="${-5} ${-jag - 5} ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <path d="${d}" fill="none" stroke="#eafcff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${d}" fill="none" stroke="var(--cyan)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    </svg>`;
  }

  function spawnSpark(){
    if(!electricLetter) return;
    const r = electricLetter.getBoundingClientRect();
    const wrapR = sparkLayer.getBoundingClientRect();

    const edge = Math.floor(Math.random() * 4);
    let sx, sy, angle;
    if (edge === 0){ sx = r.left + Math.random()*r.width; sy = r.top; angle = -60 + Math.random()*-60; }
    else if (edge === 1){ sx = r.right; sy = r.top + Math.random()*r.height; angle = -20 + Math.random()*40; }
    else if (edge === 2){ sx = r.left + Math.random()*r.width; sy = r.bottom; angle = 60 + Math.random()*60; }
    else { sx = r.left; sy = r.top + Math.random()*r.height; angle = 160 + Math.random()*40; }

    const len = 22 + Math.random() * 34;
    const jag = 6 + Math.random() * 10;

    const spark = document.createElement('div');
    spark.className = 'spark';
    spark.style.left = (sx - wrapR.left) + 'px';
    spark.style.top = (sy - wrapR.top) + 'px';
    spark.style.setProperty('--rot', angle + 'deg');
    spark.style.transform = `rotate(${angle}deg)`;
    spark.innerHTML = boltSVG(len, jag);

    sparkLayer.appendChild(spark);
    setTimeout(() => spark.remove(), 300);

    if (Math.random() < 0.35){
      setTimeout(spawnSpark, 60 + Math.random() * 80);
    }
  }

  function scheduleSparks(){
    const delay = 350 + Math.random() * 900;
    setTimeout(() => {
      spawnSpark();
      scheduleSparks();
    }, delay);
  }

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduceMotion){
    scheduleSparks();
  }

  // ================================================================
  // ===== LIVE DISCORD PRESENCE + SPOTIFY via Lanyard (lanyard.rest) =====
  // ================================================================
  const LANYARD_USER_ID = '628151749395480576';

  const pfpEl              = document.getElementById('pfp');
  const pfpStatusDotEl     = document.getElementById('pfpStatusDot');

  const musicPanelEl    = document.getElementById('musicPanel');
  const spotifyCardEl    = document.getElementById('spotifyCard');
  const spotifyArtEl     = document.getElementById('spotifyArt');
  const spotifyTrackEl   = document.getElementById('spotifyTrack');
  const spotifyArtistEl  = document.getElementById('spotifyArtist');
  const spotifyBarFill   = document.getElementById('spotifyBarFill');
  const spotifyEyebrowEl = document.getElementById('spotifyEyebrowText');

  const playlistWrapEl      = document.getElementById('playlistWrap');
  const playlistCoverEl     = document.getElementById('playlistCover');
  const playlistNameEl      = document.getElementById('playlistName');
  const playlistTrackNameEl = document.getElementById('playlistTrackName');

  const gameCardEl   = document.getElementById('gameCard');
  const gameIconEl   = document.getElementById('gameIcon');
  const gameNameEl   = document.getElementById('gameName');
  const gameDetailEl = document.getElementById('gameDetail');

  function discordAssetUrl(applicationId, assetKey){
    if (!assetKey) return null;
    if (assetKey.startsWith('mp:')){
      return `https://media.discordapp.net/${assetKey.slice(3)}`;
    }
    if (assetKey.startsWith('http://') || assetKey.startsWith('https://')){
      return assetKey;
    }
    if (!applicationId) return null;
    return `https://cdn.discordapp.com/app-assets/${applicationId}/${assetKey}.png`;
  }

  function updateGameDisplay(activity){
    if (!activity){
      gameCardEl.classList.remove('active');
      return;
    }

    const assets = activity.assets || {};
    const iconUrl = discordAssetUrl(activity.application_id, assets.large_image)
                 || discordAssetUrl(activity.application_id, assets.small_image);

    if (iconUrl){
      gameIconEl.style.visibility = 'visible';
      gameIconEl.onerror = () => {
        gameIconEl.style.visibility = 'hidden';
      };
      gameIconEl.src = iconUrl;
    } else {
      gameIconEl.style.visibility = 'hidden';
      gameIconEl.removeAttribute('src');
    }

    gameNameEl.textContent = activity.name || 'Unknown game';
    gameDetailEl.textContent = activity.details || activity.state || '';
    gameCardEl.classList.add('active');
  }

  // ---- Your three playlists ----
  const PLAYLISTS = {
    '3z6HDPzCx2mtkicUJAZFHO': {
      name: 'Flow',
      cover: 'https://image-cdn-fa.spotifycdn.com/image/ab67706c0000da847c4c7249fdc252355db39a68',
      trackIds: [
        '6YkExZc1NrbT2nLnyhmqcc','7vIVeEZCmE0UdfIIDTC9Ho','75Evj1BuXZ1wFrvqyYjzap','7HbzrODAtzr8xokwvFzps2',
        '61OMXAyUss6y4f6hQGAXVI','3RcS3P11j5PL7ttgEG5viZ','4ejvQHab2yU7Dyi3TLw6BX','4tHBWhFcnLBubY7gIboFl7',
        '6WDQP0Atfw4UIpOYKOg74r','1BMtIj5bbGbdTAxlXaseR7','2tAiZZyBxokqPnzpT21KW8','5Xb9LkVG98JiLorzV9O56r',
        '2MvEcJxJAxCr31kA5wHwve','5Xu6fjn4CSBNpo1EnAkW2E','0hZAwaGhANCzy84BJHtILG','2ALVcPPNaLzXcF4mbTp0Qs'
      ]
    },
    '6w252VUaUeLF83yxkLVC0Y': {

      cover: 'https://image-cdn-fa.spotifycdn.com/image/ab67706c0000da840892f1c3ea8558f83eba9657',
      trackIds: [
        '3Nt5m3MOIrNt1sf8v14GPM','7DswdgrPTR2xDB1vCBToi4','6NwEpX2JUWHVKWfDDfcqC4','2k4JdMWCH2PIZiGPVsznE5',
        '6jDyFXp8Sngx2FldBdwSiG','6sAdmaffuMijDszeFrGF1H','4yur1GSBfuS1VADyUYocqd','6PgUh29KzuIcI5QhK452Mb',
        '1crw5JioXcfsYu4c85FkgV','2Q4O7NWY1EmqbHOMLuVbDd','4rlYA1QkejediIRqsi2Wav','6TIi9AIRkUbdcONH2P3x9H',
        '2qolr6PKNLXvjp4JTtglSf','03U54vL2BusGyivjzEIzmT','7lnRiEP7BHXuILXNY9MH8f','3HRaPAkrok0SwsmvtQAQ8U',

      trackIds: [

        '1oAwsWBovWRIp7qLMGPIet','2AX5E86cn9n2dgioZEjirI','4SqWKzw0CbA05TGszDgMlc','5rc7178sa2YRDlBFBHY0e8',
        '43iIQbw5hx986dUEZbr3eN','6oMZhY0f1ReI6AJDDYfuSb','7bPWdJgx8vek7S5i5yAtvG','0myRViRgmQ3J8izICXEAVO',
        '1WN4uNclrDuczTO3bCr8s1','7MXVkk9YMctZqd1Srtv4MB','06iuzVAiyOTXKJDZiVuPW4','0eAuGrXyGFYwur9ARUe7LJ',
        '6G9YlbU3ByPJQvOFDRdwyM','4NeOWqHmlrGRuBvsLJC9rL','5BZsQlgw21vDOAjoqkNgKb','4tgjlCu0lAXeo4jq0SxdNW',

  function findMatchingPlaylist(trackId){
    if (!trackId) return null;
    for (const pid in PLAYLISTS){
      if (PLAYLISTS[pid].trackIds.includes(trackId)) return pid;
    }
    return null;
  }

  function updatePlaylistDisplay(trackId, songName){
    const match = findMatchingPlaylist(trackId);

    if (!match){
      playlistWrapEl.classList.remove('aura');
      return;
    }

    const pl = PLAYLISTS[match];
    playlistCoverEl.src = pl.cover;
    playlistNameEl.textContent = pl.name;
    playlistTrackNameEl.textContent = songName || '—';
    playlistWrapEl.classList.add('aura');
  }

  let spotifyTimestamps = null;

  function renderLanyard(data){
    if (!data) return;
    console.log('[lanyard] listening_to_spotify:', data.listening_to_spotify, 'spotify:', data.spotify);

    const user = data.discord_user || {};
    const avatarUrl = user.id && user.avatar
      ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128`
      : 'https://cdn.discordapp.com/embed/avatars/0.png';
    pfpEl.src = avatarUrl;

    pfpStatusDotEl.className = 'pfp-status-dot ' + (data.discord_status || 'offline');

    const activities = Array.isArray(data.activities) ? data.activities : [];
    const shown = activities.find(a => a.type !== 2 && a.type !== 4);
    const custom = activities.find(a => a.type === 4);

    let tooltip = data.discord_status
      ? data.discord_status.charAt(0).toUpperCase() + data.discord_status.slice(1)
      : 'Offline';
    if (shown){
      const verb = shown.type === 0 ? 'Playing' : shown.type === 3 ? 'Watching' : shown.type === 5 ? 'Competing in' : '';
      tooltip += ` · ${verb} ${shown.name}`.trim();
    } else if (custom && custom.state){
      tooltip += ` · ${custom.state}`;
    }
    pfpStatusDotEl.title = tooltip;

    updateGameDisplay(shown && shown.type === 0 ? shown : null);

    if (data.listening_to_spotify && data.spotify){
      const sp = data.spotify;
      musicPanelEl.classList.add('active');
      spotifyCardEl.classList.remove('idle');
      spotifyEyebrowEl.textContent = 'Listening to Spotify';
      spotifyArtEl.src = sp.album_art_url || '';
      spotifyTrackEl.textContent = sp.song || 'Unknown track';
      spotifyArtistEl.textContent = sp.artist || 'Unknown artist';
      spotifyTimestamps = sp.timestamps || null;
      updatePlaylistDisplay(sp.track_id, sp.song);
    } else {
      musicPanelEl.classList.remove('active');
      spotifyCardEl.classList.add('idle');
      spotifyArtEl.src = '';
      spotifyTrackEl.textContent = '—';
      spotifyArtistEl.textContent = '—';
      spotifyTimestamps = null;
      spotifyBarFill.style.width = '0%';
      updatePlaylistDisplay(null, null);
    }
  }

  setInterval(() => {
    if (!spotifyTimestamps) return;
    const { start, end } = spotifyTimestamps;
    const now = Date.now();
    const pct = Math.min(100, Math.max(0, ((now - start) / (end - start)) * 100));
    spotifyBarFill.style.width = pct + '%';
  }, 1000);

  async function fetchInitialPresence(){
    try{
      const res = await fetch(`https://api.lanyard.rest/v1/users/${LANYARD_USER_ID}`);
      const json = await res.json();
      console.log('[lanyard] REST response:', json);

      if (json.success){
        renderLanyard(json.data);
      } else {
        console.error('[lanyard] API returned success:false —', json.error);
        pfpStatusDotEl.title = 'Not connected — join discord.gg/lanyard with this account';
        spotifyEyebrowEl.textContent = 'Not connected to Lanyard';
      }
    }catch(err){
      console.error('[lanyard] REST fetch failed (network/CORS issue?):', err);
      pfpStatusDotEl.title = 'Connection error — see browser console';
    }
  }

  function connectLanyardSocket(){
    let socket;
    let heartbeatInterval;
    let gotFirstEvent = false;

    setTimeout(() => {
      if (!gotFirstEvent){
        console.warn('[lanyard] No INIT_STATE received after 8s — check LANYARD_USER_ID and that the account has joined discord.gg/lanyard.');
      }
    }, 8000);

    function open(){
      socket = new WebSocket('wss://api.lanyard.rest/socket');

      socket.addEventListener('open', () => {
        console.log('[lanyard] socket connected');
      });

      socket.addEventListener('message', (event) => {
        const msg = JSON.parse(event.data);

        switch (msg.op){
          case 1:
            heartbeatInterval = setInterval(() => {
              if (socket.readyState === WebSocket.OPEN){
                socket.send(JSON.stringify({ op: 3 }));
              }
            }, msg.d.heartbeat_interval);

            socket.send(JSON.stringify({
              op: 2,
              d: { subscribe_to_id: LANYARD_USER_ID }
            }));
            break;

          case 0:
            gotFirstEvent = true;
            console.log('[lanyard] event:', msg.t, msg.d);
            if (msg.t === 'INIT_STATE' || msg.t === 'PRESENCE_UPDATE'){
              renderLanyard(msg.d);
            }
            break;
        }
      });

      socket.addEventListener('close', (e) => {
        console.warn('[lanyard] socket closed, reconnecting in 3s', e.code, e.reason);
        clearInterval(heartbeatInterval);
        setTimeout(open, 3000);
      });

      socket.addEventListener('error', (e) => {
        console.error('[lanyard] socket error', e);
        socket.close();
      });
    }

    open();
  }

  if (LANYARD_USER_ID && LANYARD_USER_ID !== 'YOUR_DISCORD_USER_ID'){
    fetchInitialPresence();
    connectLanyardSocket();
  } else {
    pfpStatusDotEl.title = 'Set LANYARD_USER_ID — see comment in <script>';
  }
</script>
